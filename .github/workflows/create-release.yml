name: Create Release

on:
  push:
    branches:
      - 'main'
      - 'master'
    paths:
      - 'lean-toolchain'
  workflow_dispatch:

jobs:
  lean-release-tag:
    name: Add Lean release tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: lean-release-tag action
      # Includes upstream's fix for the all-zero `before` SHA on a repository's initial push.
      uses: leanprover-community/lean-release-tag@ee8ee743e5a36ff0e75ff51035f6a95a9d1bdf59
      with:
        # A manual run scans the complete history, which also bootstraps a newly created repo.
        before: ${{ github.event_name == 'workflow_dispatch' && '0000000000000000000000000000000000000000' || github.event.before }}
        after: ${{ github.sha }}
        do-release: true
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
